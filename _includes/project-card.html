<article class="project-card">
  <div class="project-card-image">
    {% if include.project.image %}
    <img src="{{ include.project.image | relative_url }}" alt="{{ include.project.title }}">
    {% else %}
    <div class="placeholder-image" style="width: 100%; height: 100%;">
      <span>{{ include.project.title | truncate: 20 }}</span>
    </div>
    {% endif %}
  </div>
  <div class="project-card-content">
    <h3 class="project-card-title">{{ include.project.title }}</h3>
    <p class="project-card-description">{{ include.project.description }}</p>
    <div class="project-card-tags">
      {% for tag in include.project.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
  </div>
</article>
