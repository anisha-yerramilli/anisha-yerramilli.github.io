# Build settings
markdown: kramdown
sass:
  style: compressed

# Collections for projects
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
